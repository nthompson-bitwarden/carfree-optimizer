[package]
name = "mobility-ingest"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false }
csv = "=1.4.0"
gtfs-realtime = "=0.2.0"
parquet = { version = "=59.3.3", default-features = false, features = ["snap", "zstd", "flate2-rust_backend"] }
prost = "=0.14.3"
quick-xml = "=0.41.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
